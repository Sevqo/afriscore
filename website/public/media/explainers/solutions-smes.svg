<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc"><title id="title">Growing SMEs: a practical workflow</title><desc id="desc">1. Set up your business: Add business details, currency and separate team roles. 2. Record a sale: Save the customer, create an order and issue an invoice when needed. 3. Follow its payment: Create a sandbox request and inspect the provider-confirmed result. 4. Review the day: Check outstanding invoices, exceptions and recorded movement.</desc><rect width="900" height="620" rx="16" fill="#f7f7f7"/><g font-family="Arial,sans-serif" fill="#1a1a1a"><text x="45" y="60" font-size="32" font-weight="700">Growing SMEs</text><text x="45" y="92" font-size="19" fill="#666">Illustrative workflow · read the full steps below</text><path d="M423 214h49m-14-12 14 12-14 12M670 324v28m-12-13 12 13 12-13M472 460h-49m14-12-14 12 14 12" fill="none" stroke="#426900" stroke-width="4"/><g transform="translate(45 120)"><rect width="370" height="190" rx="12" fill="#fff" stroke="#c9c9c9"/><circle cx="40" cy="40" r="21" fill="#eaf3db"/><text x="40" y="50" font-size="28" text-anchor="middle" fill="#426900">1</text><path d="M300 28h32v42h-32z m7 10h18 m-18 9h18 m-18 9h12" fill="none" stroke="#222" stroke-width="3"/><text x="24" y="104" font-size="29" font-weight="600">Set up your business</text></g><g transform="translate(485 120)"><rect width="370" height="190" rx="12" fill="#fff" stroke="#c9c9c9"/><circle cx="40" cy="40" r="21" fill="#eaf3db"/><text x="40" y="50" font-size="28" text-anchor="middle" fill="#426900">2</text><path d="M300 28h32v42h-32z m7 10h18 m-18 9h18 m-18 9h12" fill="none" stroke="#222" stroke-width="3"/><text x="24" y="104" font-size="29" font-weight="600">Record a sale</text></g><g transform="translate(485 365)"><rect width="370" height="190" rx="12" fill="#fff" stroke="#c9c9c9"/><circle cx="40" cy="40" r="21" fill="#eaf3db"/><text x="40" y="50" font-size="28" text-anchor="middle" fill="#426900">3</text><path d="M300 28h32v42h-32z m7 10h18 m-18 9h18 m-18 9h12" fill="none" stroke="#222" stroke-width="3"/><text x="24" y="104" font-size="29" font-weight="600">Follow its payment</text></g><g transform="translate(45 365)"><rect width="370" height="190" rx="12" fill="#fff" stroke="#c9c9c9"/><circle cx="40" cy="40" r="21" fill="#eaf3db"/><text x="40" y="50" font-size="28" text-anchor="middle" fill="#426900">4</text><path d="M300 28h32v42h-32z m7 10h18 m-18 9h18 m-18 9h12" fill="none" stroke="#222" stroke-width="3"/><text x="24" y="104" font-size="29" font-weight="600">Review the day</text></g><text x="45" y="594" font-size="17" fill="#666">Source and review requirements apply. Current availability is explained on this page.</text></g></svg>