name: CI

on:
  push:
    # Also test feature branches directly: once a PR is closed (or before one
    # is opened) a closed-PR branch would otherwise never run CI.
    branches: [main, "improvements/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate:openapi
      - run: npm run validate:platform

  test-postgres:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: afriscore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/afriscore_test
        run: |
          set +e
          npm run test:pg 2>&1 | tee pg-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the failing tests as check-run annotations so failures are
            # diagnosable from the public checks API (job logs need admin auth).
            grep -E '^✖ |AssertionError|actual:|expected:|error:|Error:|code:' pg-tests.log | tail -80 | while IFS= read -r line; do
              echo "::error title=postgres-test::${line}"
            done
            echo "----- tail of PostgreSQL test log -----"
            tail -60 pg-tests.log
          fi
          exit "$status"

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  website:
    name: Website build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
