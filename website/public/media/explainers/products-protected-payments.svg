<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc"><title id="title">Protected Payments: a practical workflow</title><desc id="desc">1. Agree terms: Record goods, delivery terms and inspection period. 2. Wait for partner evidence: The sandbox partner simulator confirms its payment state. 3. Deliver and inspect: Keep item-level evidence and buyer response. 4. Review the outcome: Release/refund requests follow approval and dispute rules. 5. Confirm separately: Only the partner simulator confirms the sandbox settlement state.</desc><rect width="900" height="620" rx="16" fill="#f7f7f7"/><g font-family="Arial,sans-serif" fill="#1a1a1a"><text x="45" y="60" font-size="32" font-weight="700">Protected Payments</text><text x="45" y="92" font-size="19" fill="#666">Illustrative workflow · read the full steps below</text><path d="M423 214h49m-14-12 14 12-14 12M670 324v28m-12-13 12 13 12-13M472 460h-49m14-12-14 12 14 12" fill="none" stroke="#426900" stroke-width="4"/><g transform="translate(45 120)"><rect width="370" height="190" rx="12" fill="#fff" stroke="#c9c9c9"/><circle cx="40" cy="40" r="21" fill="#eaf3db"/><text x="40" y="50" font-size="28" text-anchor="middle" fill="#426900">1</text><path d="M300 28h32v42h-32z m7 10h18 m-18 9h18 m-18 9h12" fill="none" stroke="#222" stroke-width="3"/><text x="24" y="104" font-size="29" font-weight="600">Agree terms</text></g><g transform="translate(485 120)"><rect width="370" height="190" rx="12" fill="#fff" stroke="#c9c9c9"/><circle cx="40" cy="40" r="21" fill="#eaf3db"/><text x="40" y="50" font-size="28" text-anchor="middle" fill="#426900">2</text><path d="M300 28h32v42h-32z m7 10h18 m-18 9h18 m-18 9h12" fill="none" stroke="#222" stroke-width="3"/><text x="24" y="104" font-size="29" font-weight="600">Wait for partner</text><text x="24" y="138" font-size="29" font-weight="600">evidence</text></g><g transform="translate(485 365)"><rect width="370" height="190" rx="12" fill="#fff" stroke="#c9c9c9"/><circle cx="40" cy="40" r="21" fill="#eaf3db"/><text x="40" y="50" font-size="28" text-anchor="middle" fill="#426900">3</text><path d="M300 28h32v42h-32z m7 10h18 m-18 9h18 m-18 9h12" fill="none" stroke="#222" stroke-width="3"/><text x="24" y="104" font-size="29" font-weight="600">Deliver and inspect</text></g><g transform="translate(45 365)"><rect width="370" height="190" rx="12" fill="#fff" stroke="#c9c9c9"/><circle cx="40" cy="40" r="21" fill="#eaf3db"/><text x="40" y="50" font-size="28" text-anchor="middle" fill="#426900">4</text><path d="M300 28h32v42h-32z m7 10h18 m-18 9h18 m-18 9h12" fill="none" stroke="#222" stroke-width="3"/><text x="24" y="104" font-size="29" font-weight="600">Review the outcome</text></g><text x="45" y="594" font-size="17" fill="#666">Source and review requirements apply. Current availability is explained on this page.</text></g></svg>